<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>São Francisco Sertanejo</title>
    </head>
    <body>
        <header class="site-header" style="background-image: url('res/saofranciscosertanejo.jpeg');">
            <div class="header-overlay"></div>
            <div class="header-content">
                <p class="eyebrow">Welika Welkovic</p>
                <h1>São Francisco Sertanejo</h1>
                <p class="subtitle">2026</p>
            </div>
        </header>

        <main>
            <img class="feature-image" src="res/saofranciscosertanejo.jpeg" alt="São Francisco Sertanejo">

            <div class="country-selector" role="radiogroup" aria-label="Select a country">
                <div class="flag-column">
                    <input type="radio" id="country-at" name="country" value="at" checked aria-label="Austria">
                    <label for="country-at" aria-label="Austria">🇦🇹</label>

                    <input type="radio" id="country-br" name="country" value="br" aria-label="Brazil">
                    <label for="country-br" aria-label="Brazil">🇧🇷</label>

                    <input type="radio" id="country-uk" name="country" value="uk" aria-label="United Kingdom">
                    <label for="country-uk" aria-label="United Kingdom">🇬🇧</label>
                </div>

                <div class="country-panels">
                    <div id="br" class="country-panel">Brazil panel</div>
                    <div id="uk" class="country-panel">United Kingdom panel</div>
                    <div id="at" class="country-panel">Austria panel</div>
                </div>
            </div>

            <a class="artist-card" href="index.html" aria-label="Read more about Welika Welkovic">
                <img src="res/welikaface.png" alt="Portrait of Welika Welkovic">
                <span>Welika Welkovic →</span>
            </a>

            <div class="image-grid">
                <a class="gallery-card" href="carnavaldeolinda.html">
                    <img src="res/carnavaldeolinda.jpeg" alt="Carnaval de Olinda">
                    <span class="card-label">Carnaval de Olinda</span>
                </a>
                <a class="gallery-card" href="cirandanapraia.html">
                    <img src="res/cirandanapraia.jpeg" alt="Ciranda na Praia">
                    <span class="card-label">Ciranda na Praia</span>
                </a>
                <a class="gallery-card" href="obeijosertanejo.html">
                    <img src="res/obeijosertanejo.jpeg" alt="O Beijo Sertanejo">
                    <span class="card-label">O Beijo Sertanejo</span>
                </a>
                <a class="gallery-card" href="osertanejo.html">
                    <img src="res/osertanejo.jpeg" alt="O Sertanejo">
                    <span class="card-label">O Sertanejo</span>
                </a>
                <a class="gallery-card active" aria-current="page" href="#" onclick="return false;">
                    <img src="res/saofranciscosertanejo.jpeg" alt="São Francisco Sertanejo">
                    <span class="card-label">São Francisco Sertanejo</span>
                </a>
                <a class="gallery-card" href="veredas.html">
                    <img src="res/veredas.jpeg" alt="Veredas">
                    <span class="card-label">Veredas</span>
                </a>
            </div>
        </main>

        <footer class="site-footer">
            <p>© 2026 Welika Quadros. All rights reserved.</p>
        </footer>
    </body>
</html>
